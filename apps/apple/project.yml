name: Litto
options:
  developmentLanguage: en
  bundleIdPrefix: com.jesuspaz.litto
  deploymentTarget:
    macOS: '15.0'
    iOS: '18.0'
packages:
  Litto:
    path: ../..
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: 0.12.1
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: Y76K9N6M4R
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    INFOPLIST_KEY_CFBundleDisplayName: Litto
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
    # Mac builds: "store" (sandboxed, Mac App Store) or "direct" (Developer ID for GitHub and
    # Homebrew, not sandboxed: it keeps reading local files and moves the pre-group data).
    # Direct archives pass LITTO_DISTRIBUTION=direct ENABLE_APP_SANDBOX=NO.
    LITTO_DISTRIBUTION: store
targets:
  LittoMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Resources
      - path: macOS
        excludes: ['*.entitlements']
    dependencies:
      - package: Litto
        product: LittoCore
      # Ships the MCP server inside the app: Contents/MacOS/litto-mcp
      - target: litto-mcp
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jesuspaz.litto.mac
        PRODUCT_NAME: Litto
        CODE_SIGN_ENTITLEMENTS: macOS/Litto-$(LITTO_DISTRIBUTION).entitlements
        # The app and the MCP server share an app group either way.
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  litto-mcp:
    type: tool
    platform: macOS
    sources:
      - path: ../../Sources/LittoMCP
    dependencies:
      - package: Litto
        product: LittoCore
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_NAME: litto-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.jesuspaz.litto.mcp
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        # A sandboxed tool needs its bundle id in an embedded Info.plist.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: macOS/litto-mcp-$(LITTO_DISTRIBUTION).entitlements
        ENABLE_APP_SANDBOX: YES
  LittoiOS:
    type: application
    platform: iOS
    sources: [Shared, iOS, Resources]
    dependencies:
      - package: Litto
        product: LittoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jesuspaz.litto.ios
        PRODUCT_NAME: Litto
        CODE_SIGN_ENTITLEMENTS: iOS/Litto.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
schemes:
  LittoMac:
    build:
      targets:
        LittoMac: all
  LittoiOS:
    build:
      targets:
        LittoiOS: all
